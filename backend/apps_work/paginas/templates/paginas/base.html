<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# Os links carregam o token na URL: nada disto deve ir para busca. #}
  {% block robots %}<meta name="robots" content="noindex, nofollow">{% endblock %}
  <title>{% block titulo %}Work Manage{% endblock %}</title>
  <style>
    :root {
      color-scheme: light dark;
      --fundo: #f5f5f4; --cartao: #ffffff; --texto: #1c1917; --suave: #57534e;
      --borda: #e7e5e4; --destaque: #1c1917; --destaque-texto: #ffffff;
      --erro: #b91c1c; --ok: #15803d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fundo: #0c0a09; --cartao: #1c1917; --texto: #f5f5f4; --suave: #a8a29e;
        --borda: #292524; --destaque: #f5f5f4; --destaque-texto: #1c1917;
        --erro: #f87171; --ok: #4ade80;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--fundo); color: var(--texto); line-height: 1.5;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
    .marca { font-weight: 700; margin-bottom: 20px; }
    .cartao { background: var(--cartao); border: 1px solid var(--borda); border-radius: 12px; padding: 24px; }
    h1 { font-size: 1.375rem; line-height: 1.3; margin: 0 0 12px; }
    p { margin: 0 0 12px; }
    .suave { color: var(--suave); }
    .erro { color: var(--erro); font-weight: 600; }
    .ok { color: var(--ok); font-weight: 600; }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    label.check { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; }
    input[type=password], input[type=text] {
      width: 100%; padding: 12px; font-size: 1rem; color: var(--texto);
      background: var(--fundo); border: 1px solid var(--borda); border-radius: 8px;
    }
    button {
      width: 100%; margin-top: 20px; padding: 14px; font-size: 1rem; font-weight: 600; cursor: pointer;
      color: var(--destaque-texto); background: var(--destaque); border: 0; border-radius: 8px;
    }
    button.secundario { margin-top: 12px; color: var(--suave); background: transparent; border: 1px solid var(--borda); }
    .corpo { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--borda); max-height: 60vh; overflow: auto; }
    h2 { font-size: 1.0625rem; line-height: 1.3; margin: 24px 0 8px; }
    ul { margin: 0 0 12px; padding-left: 20px; }
    li { margin-bottom: 6px; }
    code {
      font-size: 1rem; padding: 2px 6px; word-break: break-all;
      background: var(--fundo); border: 1px solid var(--borda); border-radius: 6px;
    }
  </style>
</head>
<body>
  <main>
    <div class="marca">Work Manage</div>
    <div class="cartao">{% block conteudo %}{% endblock %}</div>
  </main>
</body>
</html>

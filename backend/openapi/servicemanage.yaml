  /api/sm/v1/me/foto/:
    post:
      operationId: me_foto_create
      description: |-
        Foto do consumidor: envio e remoção.

        A imagem vai para o prefixo privado do bucket — a URL de leitura é assinada
        e expira. Diferente da logo do negócio, que é pública porque aparece no mapa
        para qualquer pessoa, o rosto do cliente só é visto por quem tem o endereço
        assinado no momento.
      summary: Enviar foto de perfil
      tags:
      - me
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FotoPerfilUploadRequest'
        required: true
      security:
      - servicemanageJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consumidor'
          description: ''

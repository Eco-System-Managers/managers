        '429':
          description: Limite de requisições atingido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /api/sm/v1/negocios/{schema_name}/:
    get:
      operationId: negocios_retrieve
      description: |-
        Um negocio pelo schema.

        Existe para a tela de perfil nao precisar baixar a vitrine inteira so para
        achar um registro — era isso que o app fazia, e o custo crescia junto com a
        plataforma.
      summary: Um negócio da vitrine
      parameters:
      - in: path
        name: schema_name
        schema:
          type: string
        required: true
      tags:
      - negocios
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:

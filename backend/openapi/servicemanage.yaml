          application/json:
            schema:
              $ref: '#/components/schemas/CadastroConsumidorRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CadastroConsumidorRequest'
          multipart/form-data:
            schema:

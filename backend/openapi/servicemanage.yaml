  /api/sm/v1/negocios/:
    get:
      operationId: negocios_list
      summary: Vitrine de negócios
      parameters:
      - in: query
        name: cidade
        schema:
          type: string
      - in: query
        name: lat
        schema:
          type: number
          format: double
      - in: query
        name: lng
        schema:
          type: number
          format: double
      - in: query
        name: nicho
        schema:
          type: string
        description: Negócios que atendem este nicho (slug).
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - in: query
        name: raio_km
        schema:
          type: number
          format: double
        description: Padrão 50 km; só vale com lat e lng.
      - in: query
        name: search
        schema:
          type: string
        description: Busca em nome, cidade e nicho.
      tags:
      - negocios
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNegocioPublicoList'
          description: ''
        '400':
          description: Requisição inválida ou regra de negócio violada.
          content:
            application/json:

          description: 'A pasta do serviço: um dos `nichos` do negócio.'
        porte:
          type: string
          description: 'Na esteira: o porte do veículo ou do pet que o serviço atende.
            Vazio vale para qualquer porte.'
        descricao:
          type: string
        duracao:
          type: integer
          description: Minutos.
        preco:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        taxa_cancelamento:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:

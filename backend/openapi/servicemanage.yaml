components:
  schemas:
    AgendamentoConsumidor:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        schema_name:
          type: string
          maxLength: 63
        agendamento_id:
          type: integer
          maximum: 2147483647
          minimum: 0
        origem:
          $ref: '#/components/schemas/OrigemAtendimentoEnum'
        negocio_nome:
          type: string
          maxLength: 255
        servicos:
          type: array
          items:
            $ref: '#/components/schemas/ServicoAgendado'
          readOnly: true
        profissional_nome:
          type: string
          maxLength: 255
        objeto_dados:
          allOf:
          - $ref: '#/components/schemas/ObjetoAgendado'
          readOnly: true
          nullable: true
        data_hora:
          type: string
          format: date-time
        duracao_total:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Duração total em minutos
        valor_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: O combinado ao marcar; depois da cobrança, o que foi cobrado
            de verdade.
        acrescimo:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: O que o atendimento custou a mais, acertado com o negócio na
            cobrança.
        acrescimo_motivo:
          type: string
          description: O motivo do acréscimo ("tempo excedido").
          maxLength: 60
        valor_taxa_cancelamento:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/StatusAgendamentoEnum'
        status_kanban:
          type: string
          nullable: true
          readOnly: true
        etapa_nome:
          type: string
          nullable: true
          readOnly: true
        logo_url:
          type: string
          nullable: true
          readOnly: true
        criado_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - agendamento_id
      - criado_em
      - data_hora
      - duracao_total
      - etapa_nome
      - id
      - logo_url
      - negocio_nome
      - objeto_dados
      - schema_name
      - servicos
      - status_kanban
      - valor_total
    BlankEnum:
      enum:
      - ''
    CadastroConsumidorRequest:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          minLength: 1
        senha:
          type: string
          writeOnly: true
          minLength: 8
        telefone:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - email
      - nome
      - senha
      - telefone
    CancelamentoAgendamento:
      type: object
      properties:
        detail:
          type: string
        taxa:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Taxa de cancelamento cobrada (0.00 dentro do prazo).
      required:
      - detail
      - taxa
    Consumidor:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 254
        telefone:
          type: string
          maxLength: 20
        foto:
          type: string
          readOnly: true
        criado_em:
          type: string
          format: date-time
          readOnly: true
        cpf:
          type: string
          maxLength: 14
        data_nascimento:
          type: string
          format: date
          nullable: true
        cep:
          type: string
          maxLength: 9
        endereco:
          type: string
          maxLength: 255
        numero_endereco:
          type: string
          maxLength: 10
      required:
      - criado_em
      - email
      - foto
      - id
      - nome
      - telefone
    CriarAgendamentoRequest:
      type: object
      properties:
        servico_ids:
          type: array
          items:
            type: integer
        data_hora:
          type: string
          format: date-time
          description: ISO 8601. No modo horário, um dos horários de disponibilidade/
            (horario_indisponivel). Pelo menos 30 min à frente (antecedencia_minima)
            e até 30 dias (fora_do_limite).
        colaborador_id:
          type: integer
          nullable: true
          description: Obrigatório em agenda por horário (colaborador_obrigatorio).
        objeto_id:
          type: integer
          nullable: true
          description: Pet ou veículo do consumidor (obrigatório em agenda por esteira).

openapi: 3.0.3
info:
  title: Service Manage API
  version: 1.0.0
  description: API do app do cliente final (B2C).
paths:
  /api/sm/v1/agendamentos/:
    get:
      operationId: agendamentos_list
      summary: Minha agenda, em todos os negócios
      parameters:
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
        description: Filtra pelo status do agendamento.
      tags:
      - agendamentos
      security:
      - servicemanageJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAgendamentoConsumidorList'
          description: ''
        '400':
          description: Requisição inválida ou regra de negócio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Não autenticado ou sessão expirada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '403':
          description: Sem permissão.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          description: Não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '429':
          description: Limite de requisições atingido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

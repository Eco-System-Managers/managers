        preco:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        taxa_cancelamento:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - duracao
      - nome
      - preco
      - taxa_cancelamento
    ServicoVitrine:

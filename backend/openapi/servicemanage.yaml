    PatchedConsumidorUpdateRequest:
      type: object
      description: |-
        Edicao do proprio cadastro pelo app.

        E-mail continua de fora, mas o motivo mudou. Nao e mais a chave que liga o
        consumidor ao Cliente de cada tenant — quem faz isso agora e
        `Cliente.consumidor_id`, que nao depende de dado que a pessoa possa trocar.

        O que sobra e que o e-mail e a credencial de login: muda-lo exige validar
        unicidade e confirmar a posse do endereco novo. Isso e um fluxo proprio, e
        nao um efeito colateral de salvar o perfil.
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 255
        telefone:
          type: string
          minLength: 1
          maxLength: 20
        cpf:
          type: string
          maxLength: 14
        data_nascimento:
          type: string
          format: date
          nullable: true
        cep:
          type: string
          maxLength: 9
        endereco:
          type: string
          maxLength: 255
        numero_endereco:
          type: string
          maxLength: 10
    PortePetEnum:
      enum:
      - pequeno
      - medio
      - grande
      - gigante
      type: string
      description: |-
        * `pequeno` - Pequeno (até 10 kg)
        * `medio` - Médio (10 a 25 kg)
        * `grande` - Grande (25 a 45 kg)
        * `gigante` - Gigante (acima de 45 kg)
    PorteVeiculoEnum:
      enum:

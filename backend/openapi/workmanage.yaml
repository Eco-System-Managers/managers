  /api/v1/auth/cadastro/:
    post:
      operationId: auth_cadastro_create
      description: Cria a empresa na hora, sem confirmar que o e-mail é de quem se
        cadastra. Fica enquanto os apps migram para o cadastro com confirmação (`/auth/cadastro/solicitar/`
        e `/auth/cadastro/confirmar/`), e depois sai.
      summary: Cadastrar empresa e dono (sem confirmar o e-mail)
      parameters:
      - in: header
        name: X-Client-Platform
        schema:
          type: string
          enum:
          - mobile
        description: 'Envie `mobile` no app: o refresh vem e vai no corpo. Sem o cabeçalho
          (web), o refresh fica só no cookie httpOnly.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CadastroRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CadastroRequest'
        required: true
      security:
      - {}
      deprecated: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessao'
          description: ''
        '400':
          description: Requisição inválida ou regra de negócio violada.
          content:

openapi: 3.0.3
info:
  title: Work Manage API
  version: 1.0.0
  description: API do painel do negócio (B2B).
paths:
  /api/v1/agenda/bloqueios/:
    get:
      operationId: agenda_bloqueios_list
      description: 'Sem editar: para mudar um bloqueio, a pessoa exclui e cria de
        novo.'
      summary: Bloqueios da agenda
      parameters:
      - in: query
        name: colaborador
        schema:
          type: integer
      - in: query
        name: data
        schema:
          type: string
          format: date
        description: Só os que valem neste dia (o fixo vale do início em diante).
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      tags:
      - agenda
      security:
      - workmanageJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBloqueioList'
          description: ''
        '400':
          description: Requisição inválida ou regra de negócio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Não autenticado ou sessão expirada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '403':
          description: Sem permissão.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          description: Não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '429':
          description: Limite de requisições atingido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    post:
      operationId: agenda_bloqueios_create
      description: O dono bloqueia a agenda de qualquer um; o parceiro, só a própria
        (403 sem_permissao_bloquear). Recusado com 400 bloqueio_com_cliente quando
        há atendimento marcado dentro do período.
      summary: Bloquear um período da agenda
      tags:
      - agenda
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloqueioRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BloqueioRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BloqueioRequest'
        required: true
      security:
      - workmanageJWT: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bloqueio'
          description: ''
        '400':
          description: Requisição inválida ou regra de negócio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Não autenticado ou sessão expirada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '403':
          description: Sem permissão.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          description: Não encontrado.
